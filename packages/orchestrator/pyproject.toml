[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campfire-orchestrator"
version = "0.1.0"
description = "Conversation orchestration service for Campfire AI companions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Campfire Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "anthropic>=0.84.0",
    "openai>=2.0.0",
    "redis>=5.2.0",
    "structlog>=25.1.0",
    "python-json-logger>=2.0.7",
    "tenacity>=8.2.3",
    "tiktoken>=0.8.0",
    "numpy>=2.0.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    # AWS SDK for Bedrock and SageMaker inference
    "aioboto3>=13.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # LiveKit real-time video/audio (WebRTC)
    "livekit>=0.17.0",
    "livekit-agents>=0.12.0",
    # Simli avatar rendering (uses aiohttp WebSocket)
    "aiohttp>=3.9.0",
    # ElevenLabs TTS (official SDK)
    "elevenlabs>=2.36.0",
    # Deepgram STT (SDK used for streaming; REST via httpx already included)
    "deepgram-sdk>=3.0.0",
]

[project.optional-dependencies]
routing = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "mypy>=1.8.0",
    "ruff>=0.8.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "faker>=22.0.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
orchestrator = "orchestrator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["orchestrator"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["orchestrator"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

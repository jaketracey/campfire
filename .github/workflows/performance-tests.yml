name: Performance Tests

on:
  # Run on pull requests to main
  pull_request:
    branches: [main]
  # Run on pushes to main
  push:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:
  # Run nightly
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC daily

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.0'

jobs:
  api-performance:
    name: API Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campfire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @campfire/shared build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Run API latency tests
        run: pnpm --filter @campfire/gateway test tests/performance/api-latency.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_OPTIONS: --expose-gc

      - name: Run database performance tests
        run: pnpm --filter @campfire/gateway test tests/performance/database.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          NODE_OPTIONS: --expose-gc

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-results
          path: packages/gateway/performance-results/
          retention-days: 30

  websocket-performance:
    name: WebSocket Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campfire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @campfire/shared build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Run WebSocket performance tests
        run: pnpm --filter @campfire/gateway test tests/performance/websocket.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_OPTIONS: --expose-gc

  worker-performance:
    name: Worker Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run worker performance tests
        run: pnpm --filter @campfire/workers test tests/performance/worker-jobs.test.ts
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campfire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @campfire/shared build && pnpm --filter @campfire/gateway build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Start application
        run: |
          pnpm --filter @campfire/gateway start &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          PORT: 3000
          JWT_SECRET: test-jwt-secret-for-testing-only-min-32-chars
          INTERNAL_SERVICE_KEY: test-internal-service-key
          NODE_ENV: test

      - name: Run k6 API load tests
        run: k6 run --vus 10 --duration 30s packages/gateway/tests/load/k6-api-load.js
        env:
          BASE_URL: http://localhost:3000

      - name: Run k6 WebSocket load tests
        run: k6 run --vus 10 --duration 30s packages/gateway/tests/load/k6-websocket-load.js
        env:
          WS_URL: ws://localhost:3000

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-results/
          retention-days: 30

  stability-tests:
    name: Stability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campfire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @campfire/shared build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Run memory leak detection tests
        run: pnpm --filter @campfire/gateway test tests/stability/memory-leak.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_OPTIONS: --expose-gc

      - name: Run recovery tests
        run: pnpm --filter @campfire/gateway test tests/stability/recovery.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  e2e-performance:
    name: E2E Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campfire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @campfire/shared build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Run E2E performance tests
        run: pnpm --filter @campfire/gateway test tests/e2e/conversation-flow.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfire_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: campfire_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [api-performance, websocket-performance, worker-performance, load-tests, stability-tests, e2e-performance]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Generate summary report
        run: |
          echo "# Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Status" >> $GITHUB_STEP_SUMMARY
          echo "- API Performance: ${{ needs.api-performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WebSocket Performance: ${{ needs.websocket-performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Performance: ${{ needs.worker-performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Load Tests: ${{ needs.load-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stability Tests: ${{ needs.stability-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Performance: ${{ needs.e2e-performance.result }}" >> $GITHUB_STEP_SUMMARY

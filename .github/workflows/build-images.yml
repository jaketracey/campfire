# =============================================================================
# GitHub Actions: Build and Push Docker Images to ECR
# =============================================================================
# Builds all service images in parallel and pushes to Amazon ECR
# Triggered on push to main or manually
# Uses native ARM64 runners for fast builds (~3-5 min)
# =============================================================================

name: Build Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 932630290000.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: infra/docker/Dockerfile.gateway
          - service: web
            dockerfile: infra/docker/Dockerfile.web
          - service: workers
            dockerfile: infra/docker/Dockerfile.workers
          - service: orchestrator
            dockerfile: infra/docker/Dockerfile.orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/campfire-${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/campfire-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=https://ignite.cam
            NEXT_PUBLIC_WS_URL=wss://ignite.cam/ws
            NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_FLOWGUARD_SHOP_ID=${{ secrets.FLOWGUARD_SHOP_ID }}

  # Note: Deploy must be triggered manually or via workflow_run
  # The GITHUB_TOKEN doesn't have permission to trigger other workflows

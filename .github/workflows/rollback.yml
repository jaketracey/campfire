# =============================================================================
# Campfire - Manual Rollback Workflow
# =============================================================================
# Emergency rollback to a previous deployment
#
# Use this workflow when:
#   - A deployment causes production issues
#   - Automatic rollback did not trigger
#   - You need to revert to a specific version
#
# This workflow can rollback to:
#   - The previous stable deployment
#   - A specific task definition revision
#   - A specific image tag
# =============================================================================

name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      services:
        description: 'Services to rollback (comma-separated or "all")'
        required: true
        type: string
        default: 'all'
      rollback_type:
        description: 'Rollback type'
        required: true
        type: choice
        options:
          - previous
          - specific_revision
          - specific_tag
        default: 'previous'
      target_revision:
        description: 'Target task definition revision (for specific_revision) or image tag (for specific_tag)'
        required: false
        type: string
        default: ''
      reason:
        description: 'Reason for rollback (for audit trail)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: campfire

jobs:
  # ===========================================================================
  # Confirm Rollback
  # ===========================================================================
  confirm:
    name: Confirm Rollback
    runs-on: ubuntu-latest
    outputs:
      services_list: ${{ steps.parse.outputs.services_list }}
    steps:
      - name: Parse services
        id: parse
        run: |
          SERVICES="${{ github.event.inputs.services }}"
          if [[ "${SERVICES}" == "all" ]]; then
            SERVICES_LIST='["gateway", "orchestrator", "web", "marketing", "workers"]'
          else
            # Convert comma-separated to JSON array
            SERVICES_LIST=$(echo "${SERVICES}" | tr ',' '\n' | jq -R . | jq -s .)
          fi
          echo "services_list=${SERVICES_LIST}" >> $GITHUB_OUTPUT

      - name: Display rollback plan
        run: |
          echo "## Rollback Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Services | ${{ github.event.inputs.services }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback Type | ${{ github.event.inputs.rollback_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ github.event.inputs.target_revision || 'Previous stable' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Initiated By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Production Gate
  # ===========================================================================
  prod-gate:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: confirm
    if: github.event.inputs.environment == 'prod'
    environment:
      name: production-rollback
    steps:
      - name: Confirm production rollback
        run: |
          echo "Production rollback approved by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"

  # ===========================================================================
  # Execute Rollback
  # ===========================================================================
  rollback:
    name: Rollback ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [confirm, prod-gate]
    if: |
      always() &&
      needs.confirm.result == 'success' &&
      (needs.prod-gate.result == 'success' || needs.prod-gate.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.confirm.outputs.services_list) }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Emit rollback.started event
        run: |
          aws logs put-log-events \
            --log-group-name "/campfire/${{ github.event.inputs.environment }}/deployments" \
            --log-stream-name "deploy-events" \
            --log-events "[{
              \"timestamp\": $(date +%s000),
              \"message\": \"{\\\"event_type\\\": \\\"rollback.started\\\", \\\"service\\\": \\\"${{ matrix.service }}\\\", \\\"environment\\\": \\\"${{ github.event.inputs.environment }}\\\", \\\"rollback_type\\\": \\\"${{ github.event.inputs.rollback_type }}\\\", \\\"reason\\\": \\\"${{ github.event.inputs.reason }}\\\", \\\"actor\\\": \\\"${{ github.actor }}\\\"}\"
            }]" || true

      - name: Get current deployment info
        id: current
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "current_task_def=${CURRENT_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "Current task definition: ${CURRENT_TASK_DEF}"

      - name: Determine rollback target
        id: target
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          TASK_FAMILY="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          ROLLBACK_TYPE="${{ github.event.inputs.rollback_type }}"
          TARGET_INPUT="${{ github.event.inputs.target_revision }}"

          case "${ROLLBACK_TYPE}" in
            previous)
              # Get previous task definition revision
              TARGET_TASK_DEF=$(aws ecs list-task-definitions \
                --family-prefix "${TASK_FAMILY}" \
                --sort DESC \
                --status ACTIVE \
                --query 'taskDefinitionArns[1]' \
                --output text)
              ;;

            specific_revision)
              # Use specific revision number
              TARGET_TASK_DEF="arn:aws:ecs:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:task-definition/${TASK_FAMILY}:${TARGET_INPUT}"
              ;;

            specific_tag)
              # Find task definition with specific image tag
              # List recent task definitions and find one with matching image
              ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}/${{ matrix.service }}:${TARGET_INPUT}"

              TARGET_TASK_DEF=""
              for TASK_DEF in $(aws ecs list-task-definitions --family-prefix "${TASK_FAMILY}" --sort DESC --status ACTIVE --query 'taskDefinitionArns[:10]' --output text); do
                IMAGE=$(aws ecs describe-task-definition --task-definition "${TASK_DEF}" --query "taskDefinition.containerDefinitions[?name=='${{ matrix.service }}'].image" --output text)
                if [[ "${IMAGE}" == "${ECR_IMAGE}" ]]; then
                  TARGET_TASK_DEF="${TASK_DEF}"
                  break
                fi
              done

              if [[ -z "${TARGET_TASK_DEF}" ]]; then
                echo "Error: Could not find task definition with image tag: ${TARGET_INPUT}"
                exit 1
              fi
              ;;
          esac

          if [[ -z "${TARGET_TASK_DEF}" ]] || [[ "${TARGET_TASK_DEF}" == "None" ]]; then
            echo "Error: No valid rollback target found"
            exit 1
          fi

          echo "target_task_def=${TARGET_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "Rollback target: ${TARGET_TASK_DEF}"

      - name: Validate rollback target
        run: |
          TARGET_TASK_DEF="${{ steps.target.outputs.target_task_def }}"

          # Verify task definition exists and is valid
          aws ecs describe-task-definition \
            --task-definition "${TARGET_TASK_DEF}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text

          echo "Task definition validated: ${TARGET_TASK_DEF}"

      - name: Execute rollback
        id: rollback
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          TARGET_TASK_DEF="${{ steps.target.outputs.target_task_def }}"

          echo "Rolling back ${SERVICE_NAME} to ${TARGET_TASK_DEF}"

          aws ecs update-service \
            --cluster "${CLUSTER_NAME}" \
            --service "${SERVICE_NAME}" \
            --task-definition "${TARGET_TASK_DEF}" \
            --force-new-deployment

          echo "Rollback initiated, waiting for stabilization..."

      - name: Wait for service stability
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"

          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}"

          echo "Service stabilized successfully"

      - name: Verify rollback
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          TARGET_TASK_DEF="${{ steps.target.outputs.target_task_def }}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ "${CURRENT_TASK_DEF}" == "${TARGET_TASK_DEF}" ]]; then
            echo "Rollback verified successfully"
          else
            echo "Warning: Current task definition (${CURRENT_TASK_DEF}) does not match target (${TARGET_TASK_DEF})"
          fi

      - name: Emit rollback.completed event
        if: success()
        run: |
          aws logs put-log-events \
            --log-group-name "/campfire/${{ github.event.inputs.environment }}/deployments" \
            --log-stream-name "deploy-events" \
            --log-events "[{
              \"timestamp\": $(date +%s000),
              \"message\": \"{\\\"event_type\\\": \\\"rollback.completed\\\", \\\"service\\\": \\\"${{ matrix.service }}\\\", \\\"environment\\\": \\\"${{ github.event.inputs.environment }}\\\", \\\"previous_task_def\\\": \\\"${{ steps.current.outputs.current_task_def }}\\\", \\\"new_task_def\\\": \\\"${{ steps.target.outputs.target_task_def }}\\\", \\\"reason\\\": \\\"${{ github.event.inputs.reason }}\\\"}\"
            }]" || true

      - name: Emit rollback.failed event
        if: failure()
        run: |
          aws logs put-log-events \
            --log-group-name "/campfire/${{ github.event.inputs.environment }}/deployments" \
            --log-stream-name "deploy-events" \
            --log-events "[{
              \"timestamp\": $(date +%s000),
              \"message\": \"{\\\"event_type\\\": \\\"rollback.failed\\\", \\\"service\\\": \\\"${{ matrix.service }}\\\", \\\"environment\\\": \\\"${{ github.event.inputs.environment }}\\\", \\\"reason\\\": \\\"${{ github.event.inputs.reason }}\\\"}\"
            }]" || true

  # ===========================================================================
  # Post-Rollback Verification
  # ===========================================================================
  verify:
    name: Post-Rollback Verification
    runs-on: ubuntu-latest
    needs: [confirm, rollback]
    if: always() && needs.rollback.result == 'success'
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Run health checks
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "Running health checks against: ${ALB_DNS}"

          # Check each service health endpoint
          for endpoint in "/api/health"; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "https://${ALB_DNS}${endpoint}" || echo "000")

            if [[ "${HTTP_STATUS}" == "200" ]]; then
              echo "[PASS] ${endpoint} returned ${HTTP_STATUS}"
            else
              echo "[WARN] ${endpoint} returned ${HTTP_STATUS}"
            fi
          done

      - name: Generate rollback summary
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Services | ${{ github.event.inputs.services }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback Type | ${{ github.event.inputs.rollback_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Initiated By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify application functionality" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor error rates and latency" >> $GITHUB_STEP_SUMMARY
          echo "3. Investigate root cause of the issue" >> $GITHUB_STEP_SUMMARY
          echo "4. Create a fix and test before redeploying" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# Pull Request Validation Checks
# =============================================================================
# Lightweight checks specific to pull requests:
# - PR title and body validation (conventional commits)
# - Change detection for conditional job execution
# - Bundle size analysis and limits
# - Dependency review for security
#
# These checks run quickly and provide early feedback on PR quality.
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  # ===========================================================================
  # PR Title Validation
  # ===========================================================================
  # Enforces conventional commit format for PR titles.
  # This enables automatic changelog generation and semantic versioning.
  #
  # Valid prefixes: feat, fix, docs, style, refactor, perf, test, build, ci, chore
  # Optional scope: feat(gateway): add new endpoint
  # Breaking changes: feat!: or feat(scope)!:
  # ===========================================================================
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Require conventional commit format
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

          # Optional scopes matching package names
          scopes: |
            gateway
            orchestrator
            web
            workers
            shared
            deps
            release

          # Require scope for certain types
          requireScope: false

          # Disallow WIP prefix
          disallowScopes: |
            wip

          # Ensure subject is not empty and starts lowercase
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            PR title subject must start with a lowercase letter.
            Example: "feat(gateway): add user authentication endpoint"

          # Allow ! for breaking changes
          validateSingleCommit: false
          ignoreLabels: |
            bot
            dependencies

  # ===========================================================================
  # PR Body Validation
  # ===========================================================================
  # Ensures PR descriptions contain required information.
  # Empty or template-only PRs are rejected.
  # ===========================================================================
  pr-body:
    name: PR Body
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body is not empty
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const trimmedBody = prBody.trim();

            // Minimum content requirements
            const minLength = 50;

            // Template placeholders that indicate unfilled sections
            const templatePatterns = [
              /<!-- .* -->/g,      // HTML comments
              /\[.*\]/g,           // Checkbox placeholders
              /TODO:/gi,           // TODO markers
              /FIXME:/gi,          // FIXME markers
              /DELETE THIS/gi,     // Template instructions
            ];

            // Remove template artifacts for length check
            let cleanBody = trimmedBody;
            for (const pattern of templatePatterns) {
              cleanBody = cleanBody.replace(pattern, '');
            }
            cleanBody = cleanBody.trim();

            if (cleanBody.length < minLength) {
              core.setFailed(
                `PR description is too short (${cleanBody.length} chars, minimum ${minLength}).\n` +
                `Please provide a meaningful description of your changes including:\n` +
                `- What changes were made\n` +
                `- Why these changes are needed\n` +
                `- Any testing performed`
              );
              return;
            }

            // Check for required sections (flexible matching)
            const hasDescription = /## (Summary|Description|What|Changes)/i.test(trimmedBody) ||
                                   cleanBody.length >= 100;

            if (!hasDescription && !context.payload.pull_request.draft) {
              core.warning(
                'Consider adding a "## Summary" section to describe your changes.'
              );
            }

            console.log('PR body validation passed');

  # ===========================================================================
  # Change Detection
  # ===========================================================================
  # Detects which packages have changes to enable conditional job execution.
  # Outputs can be used by other workflows to skip unnecessary jobs.
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      orchestrator: ${{ steps.changes.outputs.orchestrator }}
      web: ${{ steps.changes.outputs.web }}
      workers: ${{ steps.changes.outputs.workers }}
      shared: ${{ steps.changes.outputs.shared }}
      infra: ${{ steps.changes.outputs.infra }}
      ci: ${{ steps.changes.outputs.ci }}
      any-package: ${{ steps.changes.outputs.any-package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            gateway:
              - 'packages/gateway/**'
              - 'packages/shared/**'
            orchestrator:
              - 'packages/orchestrator/**'
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
            workers:
              - 'packages/workers/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'
            infra:
              - 'infra/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
            ci:
              - '.github/workflows/**'
              - 'turbo.json'
              - 'pnpm-lock.yaml'
            any-package:
              - 'packages/**'

      - name: Output detected changes
        run: |
          echo "Changes detected:"
          echo "  gateway: ${{ steps.changes.outputs.gateway }}"
          echo "  orchestrator: ${{ steps.changes.outputs.orchestrator }}"
          echo "  web: ${{ steps.changes.outputs.web }}"
          echo "  workers: ${{ steps.changes.outputs.workers }}"
          echo "  shared: ${{ steps.changes.outputs.shared }}"
          echo "  infra: ${{ steps.changes.outputs.infra }}"
          echo "  ci: ${{ steps.changes.outputs.ci }}"
          echo "  any-package: ${{ steps.changes.outputs.any-package }}"

  # ===========================================================================
  # Bundle Size Analysis
  # ===========================================================================
  # Analyzes and reports bundle sizes for Next.js applications.
  # Compares against base branch and enforces size limits.
  # ===========================================================================
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@campfire/web

      - name: Analyze web bundle
        if: needs.detect-changes.outputs.web == 'true'
        run: |
          echo "## Web App Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if .next directory exists
          if [ -d "packages/web/.next" ]; then
            # Get build output stats
            if [ -f "packages/web/.next/build-manifest.json" ]; then
              echo "Build manifest found" >> $GITHUB_STEP_SUMMARY

              # Calculate total size of static chunks
              STATIC_SIZE=$(du -sh packages/web/.next/static 2>/dev/null | cut -f1 || echo "N/A")
              echo "Static assets size: $STATIC_SIZE" >> $GITHUB_STEP_SUMMARY
            fi

            # Check server bundle sizes
            if [ -d "packages/web/.next/server" ]; then
              SERVER_SIZE=$(du -sh packages/web/.next/server 2>/dev/null | cut -f1 || echo "N/A")
              echo "Server bundle size: $SERVER_SIZE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No .next directory found - build may have failed" >> $GITHUB_STEP_SUMMARY
          fi

      # Size limit enforcement using size-limit
      - name: Check bundle size limits
        id: size-check
        run: |
          # Define size limits (in bytes)
          # Adjust these thresholds based on your performance budget
          WEB_LIMIT_MB=5

          FAILED=false

          # Check web bundle
          if [ -d "packages/web/.next/static" ]; then
            WEB_SIZE=$(du -sm packages/web/.next/static | cut -f1)
            echo "Web static size: ${WEB_SIZE}MB (limit: ${WEB_LIMIT_MB}MB)"

            if [ "$WEB_SIZE" -gt "$WEB_LIMIT_MB" ]; then
              echo "::error::Web bundle size (${WEB_SIZE}MB) exceeds limit (${WEB_LIMIT_MB}MB)"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = true ]; then
            echo "Bundle size check failed - consider code splitting or removing unused dependencies"
            exit 1
          fi

  # ===========================================================================
  # Dependency Review
  # ===========================================================================
  # Scans dependencies for known vulnerabilities.
  # Runs on PRs that modify package manifests.
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-package == 'true' || needs.detect-changes.outputs.ci == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high and critical vulnerabilities
          fail-on-severity: high

          # Allow specific licenses
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense

          # Deny copyleft licenses in production dependencies
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

          # Only check direct dependencies (not transitive)
          # Comment out to also check transitive dependencies
          # vulnerability-check: true

  # ===========================================================================
  # PR Size Check
  # ===========================================================================
  # Warns about large PRs that may be difficult to review.
  # Encourages breaking large changes into smaller, focused PRs.
  # ===========================================================================
  pr-size:
    name: PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            const changedFiles = pr.changed_files || 0;

            // Size thresholds
            const WARN_LINES = 500;
            const ERROR_LINES = 1500;
            const WARN_FILES = 20;
            const ERROR_FILES = 50;

            console.log(`PR Stats: +${additions}/-${deletions} lines, ${changedFiles} files`);

            // Add size label
            let sizeLabel = 'size/S';
            if (totalChanges > 1000 || changedFiles > 30) {
              sizeLabel = 'size/XL';
            } else if (totalChanges > 500 || changedFiles > 20) {
              sizeLabel = 'size/L';
            } else if (totalChanges > 200 || changedFiles > 10) {
              sizeLabel = 'size/M';
            }

            // Try to add label (may fail if label doesn't exist)
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [sizeLabel]
              });
            } catch (e) {
              console.log(`Could not add label ${sizeLabel}: ${e.message}`);
            }

            // Generate summary
            let summary = `## PR Size Analysis\n\n`;
            summary += `| Metric | Value | Status |\n`;
            summary += `|--------|-------|--------|\n`;
            summary += `| Lines Added | +${additions} | ${additions > WARN_LINES ? 'Large' : 'OK'} |\n`;
            summary += `| Lines Removed | -${deletions} | - |\n`;
            summary += `| Total Changes | ${totalChanges} | ${totalChanges > WARN_LINES ? 'Large' : 'OK'} |\n`;
            summary += `| Files Changed | ${changedFiles} | ${changedFiles > WARN_FILES ? 'Many' : 'OK'} |\n`;
            summary += `| Size Category | ${sizeLabel} | - |\n`;

            core.summary.addRaw(summary).write();

            // Warnings and errors
            if (totalChanges > ERROR_LINES || changedFiles > ERROR_FILES) {
              core.warning(
                `This PR is very large (${totalChanges} lines, ${changedFiles} files). ` +
                `Consider breaking it into smaller, focused PRs for easier review.`
              );
            } else if (totalChanges > WARN_LINES || changedFiles > WARN_FILES) {
              core.notice(
                `This PR is moderately large (${totalChanges} lines, ${changedFiles} files). ` +
                `If possible, consider splitting into smaller PRs.`
              );
            }

  # ===========================================================================
  # Commit Message Validation
  # ===========================================================================
  # Validates individual commit messages follow conventional commits.
  # Helps maintain a clean git history.
  # ===========================================================================
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ''
          failOnWarnings: false
          # Use default conventional commit rules
        continue-on-error: true  # Don't block PR, just warn

  # ===========================================================================
  # PR Checks Status
  # ===========================================================================
  # Aggregate job for branch protection rules.
  # ===========================================================================
  pr-checks-status:
    name: PR Checks Status
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - pr-body
      - detect-changes
      - pr-size
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          results="${{ needs.pr-title.result }} ${{ needs.pr-body.result }} ${{ needs.detect-changes.result }} ${{ needs.pr-size.result }}"

          echo "Job results: $results"

          if echo "$results" | grep -qE "(failure|cancelled)"; then
            echo "One or more PR checks failed"
            exit 1
          fi

          echo "All PR checks passed"

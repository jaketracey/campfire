# =============================================================================
# GitHub Actions: Deploy to Stealth (Single EC2 Instance)
# =============================================================================
# Pulls pre-built images from ECR and restarts services
# Triggered by build-images workflow or manual dispatch
# =============================================================================

name: Deploy to Stealth

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Images"]
    types:
      - completed
    branches:
      - main

env:
  DEPLOY_HOST: ${{ secrets.STEALTH_HOST }}
  DEPLOY_USER: ec2-user
  APP_DIR: /opt/campfire
  COMPOSE_FILE: infra/docker/docker-compose.stealth.yml
  ENV_FILE: /opt/campfire/.env.stealth
  AWS_REGION: us-east-1
  ECR_REGISTRY: 932630290000.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    name: Deploy to Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if triggered manually or if build-images succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_MEDIA_BUCKET: ${{ secrets.S3_MEDIA_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          PROVIDER_KEY_ENCRYPTION_SECRET: ${{ secrets.PROVIDER_KEY_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail

          missing=0
          check() {
            local key="$1"
            if [ -z "${!key:-}" ]; then
              echo "::error ::Required secret '$key' is missing."
              missing=1
            fi
          }

          check AWS_ACCESS_KEY_ID
          check AWS_SECRET_ACCESS_KEY
          check S3_MEDIA_BUCKET
          check JWT_SECRET
          check SESSION_SECRET
          check INTERNAL_SERVICE_KEY
          check PROVIDER_KEY_ENCRYPTION_SECRET

          if [ "$missing" -eq 1 ]; then
            echo "Deployment blocked until required secrets are configured in repository secrets."
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STEALTH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STEALTH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync config files to server
        run: |
          rsync -avz \
            --include='infra/***' \
            --include='pnpm-lock.yaml' \
            --include='package.json' \
            --exclude='*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.APP_DIR }}/

      - name: Update environment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_MEDIA_BUCKET: ${{ secrets.S3_MEDIA_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          PROVIDER_KEY_ENCRYPTION_SECRET: ${{ secrets.PROVIDER_KEY_ENCRYPTION_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FLOWGUARD_SHOP_ID: ${{ secrets.FLOWGUARD_SHOP_ID }}
          FLOWGUARD_SIGNATURE_KEY: ${{ secrets.FLOWGUARD_SIGNATURE_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          # LiveKit, Deepgram, ElevenLabs — needed by gateway and orchestrator
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_WS_URL: ${{ secrets.LIVEKIT_WS_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CAMPFIRE_IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "
          set -e
          ENV_FILE=/opt/campfire/.env.stealth

          # Function to update or add env var
          update_env() {
            local key=\$1
            local value=\$2
            if grep -q \"^\${key}=\" \"\$ENV_FILE\" 2>/dev/null; then
              sed -i \"s|^\${key}=.*|\${key}=\${value}|\" \"\$ENV_FILE\"
            else
              echo \"\${key}=\${value}\" >> \"\$ENV_FILE\"
            fi
          }

          # Update AWS credentials
          update_env 'AWS_ACCESS_KEY_ID' '${AWS_ACCESS_KEY_ID}'
          update_env 'AWS_SECRET_ACCESS_KEY' '${AWS_SECRET_ACCESS_KEY}'
          update_env 'AWS_REGION' '${AWS_REGION}'
          update_env 'S3_MEDIA_BUCKET' '${S3_MEDIA_BUCKET}'

          # Update other secrets
          update_env 'JWT_SECRET' '${JWT_SECRET}'
          update_env 'SESSION_SECRET' '${SESSION_SECRET}'
          update_env 'INTERNAL_SERVICE_KEY' '${INTERNAL_SERVICE_KEY}'
          update_env 'PROVIDER_KEY_ENCRYPTION_SECRET' '${PROVIDER_KEY_ENCRYPTION_SECRET}'
          update_env 'GOOGLE_OAUTH_CLIENT_ID' '${GOOGLE_OAUTH_CLIENT_ID}'
          update_env 'GOOGLE_OAUTH_CLIENT_SECRET' '${GOOGLE_OAUTH_CLIENT_SECRET}'
          update_env 'FLOWGUARD_SHOP_ID' '${FLOWGUARD_SHOP_ID}'
          update_env 'FLOWGUARD_SIGNATURE_KEY' '${FLOWGUARD_SIGNATURE_KEY}'
          update_env 'FACEBOOK_APP_ID' '${FACEBOOK_APP_ID}'
          update_env 'FACEBOOK_APP_SECRET' '${FACEBOOK_APP_SECRET}'

          # LiveKit (video chat)
          update_env 'LIVEKIT_API_KEY' '${LIVEKIT_API_KEY}'
          update_env 'LIVEKIT_API_SECRET' '${LIVEKIT_API_SECRET}'
          update_env 'LIVEKIT_URL' '${LIVEKIT_URL}'
          update_env 'LIVEKIT_WS_URL' '${LIVEKIT_WS_URL}'

          # Deepgram (STT) and ElevenLabs (TTS/voice)
          update_env 'DEEPGRAM_API_KEY' '${DEEPGRAM_API_KEY}'
          update_env 'ELEVENLABS_API_KEY' '${ELEVENLABS_API_KEY}'

          # Image tag and ECR registry for docker compose
          update_env 'CAMPFIRE_IMAGE_TAG' '${CAMPFIRE_IMAGE_TAG}'
          update_env 'ECR_REGISTRY' '932630290000.dkr.ecr.us-east-1.amazonaws.com'

          echo 'Environment secrets updated'
          "

      - name: Write remote deploy script
        run: |
          # We write the deploy body to a local file then scp it, instead of
          # inlining it in an ssh heredoc. The heredoc form was dropping the
          # ssh session mid-execution (likely an OOM or idle policy on the
          # t4g.small), making the workflow report success while most of the
          # restart steps never ran.
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail
          cd /opt/campfire/infra/docker
          set -a && source /opt/campfire/.env.stealth && set +a

          echo "=== Logging into ECR ==="
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin 932630290000.dkr.ecr.us-east-1.amazonaws.com

          # Server has only 50GB disk — prune BEFORE pulling to avoid "no space left on device"
          echo "=== Pruning old images to free disk space ==="
          docker image prune -af --filter "until=24h" || true
          docker builder prune -f --keep-storage=2GB 2>/dev/null || true
          df -h / | tail -1

          DC="docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth"

          echo "=== Pulling latest images ==="
          $DC pull gateway web workers orchestrator nginx

          echo "=== Ensuring infra is up ==="
          $DC up -d --no-deps postgres redis
          for i in {1..30}; do
            $DC exec -T postgres pg_isready -U campfire -d campfire >/dev/null 2>&1 && break
            echo "Waiting for postgres... ($i/30)"
            [ "$i" -eq 30 ] && { echo "Postgres not ready"; exit 1; }
            sleep 3
          done

          echo "=== Running migrations ==="
          $DC run --rm --no-deps gateway node dist/db/migrate.js up

          echo "=== Rolling restart: gateway ==="
          $DC up -d --no-deps --force-recreate gateway
          sleep 10

          echo "=== Rolling restart: orchestrator ==="
          $DC up -d --no-deps --force-recreate orchestrator
          sleep 8

          echo "=== Rolling restart: web ==="
          $DC up -d --no-deps --force-recreate web
          sleep 5

          echo "=== Rolling restart: workers ==="
          $DC up -d --no-deps --force-recreate workers
          sleep 5

          echo "=== Waiting for health checks ==="
          for i in {1..45}; do
            if $DC exec -T gateway sh -lc "wget -q --tries=1 --timeout=5 --spider http://localhost:4000/health" >/dev/null 2>&1 \
              && $DC exec -T orchestrator sh -lc "wget -q --tries=1 --timeout=5 --spider http://localhost:5000/health" >/dev/null 2>&1; then
              echo "Core services healthy."
              break
            fi
            echo "Waiting for health... ($i/45)"
            [ "$i" -eq 45 ] && { echo "Health checks failed"; $DC ps --all; exit 1; }
            sleep 4
          done

          # Nginx caches upstream DNS — MUST restart after recreating services
          echo "=== Restarting nginx to refresh upstream DNS ==="
          $DC stop nginx && $DC rm -f nginx && $DC up -d nginx
          sleep 5

          echo "=== Post-deploy cleanup ==="
          docker image prune -f

          echo "=== Deployment complete ==="
          $DC ps
          REMOTE
          chmod +x /tmp/remote-deploy.sh

      - name: Upload and run deploy script (detached)
        run: |
          # Copy the script and then run it detached from the ssh session so an
          # ssh drop can't abort the deploy. Log goes to a file we tail back.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            /tmp/remote-deploy.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/remote-deploy.sh

          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} '
            set -e
            chmod +x /tmp/remote-deploy.sh
            rm -f /tmp/remote-deploy.log /tmp/remote-deploy.exit
            nohup bash -c "
              /tmp/remote-deploy.sh; echo \$? > /tmp/remote-deploy.exit
            " > /tmp/remote-deploy.log 2>&1 &
            disown
            echo "deploy started pid=$!"
          '

      - name: Wait for deploy to finish and stream log
        run: |
          # Poll the remote exit file. Stream new log lines between polls so the
          # GH Actions log mirrors the remote run. Bail out with the remote
          # script's exit code.
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} '
            last=0
            # Max 25 minutes of waiting; typical deploys are 3-5 min.
            for attempt in $(seq 1 150); do
              if [ -f /tmp/remote-deploy.log ]; then
                total=$(wc -l < /tmp/remote-deploy.log)
                if [ "$total" -gt "$last" ]; then
                  tail -n +$((last + 1)) /tmp/remote-deploy.log
                  last=$total
                fi
              fi
              if [ -f /tmp/remote-deploy.exit ]; then
                code=$(cat /tmp/remote-deploy.exit)
                echo "--- remote deploy finished with exit $code ---"
                exit "$code"
              fi
              sleep 10
            done
            echo "::error::Deploy did not finish within 25 minutes"
            tail -n 200 /tmp/remote-deploy.log || true
            exit 1
          '

      - name: Health check
        run: |
          sleep 10
          echo "Checking site health..."
          # Retry up to 3 times with 10s gaps to allow nginx to settle
          for attempt in 1 2 3; do
            if curl -sf --max-time 10 https://ignite.cam/nginx-health -o /dev/null; then
              echo "Nginx health check passed (attempt $attempt)"
              exit 0
            fi
            echo "Health check attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts — site may be down"
          exit 1

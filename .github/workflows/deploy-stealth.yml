# =============================================================================
# GitHub Actions: Deploy to Stealth (Single EC2 Instance)
# =============================================================================
# Triggers on push to main branch or manual dispatch
# Syncs code via rsync, builds Docker images on EC2, restarts services
# =============================================================================

name: Deploy to Stealth

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all containers (no cache)'
        required: false
        default: 'false'
        type: boolean

env:
  DEPLOY_HOST: ${{ secrets.STEALTH_HOST }}
  DEPLOY_USER: ec2-user
  APP_DIR: /opt/campfire
  COMPOSE_FILE: infra/docker/docker-compose.stealth.yml
  ENV_FILE: /opt/campfire/.env.stealth

jobs:
  deploy:
    name: Deploy to Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STEALTH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STEALTH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'infra/docker/nginx/ssl' \
            --exclude 'infra/aws-cli/stealth/*.pem' \
            --exclude '*.pem' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.APP_DIR }}/

      - name: Build and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd /opt/campfire/infra/docker

          echo "=== Building containers ==="
          BUILD_FLAGS=""
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            BUILD_FLAGS="--no-cache"
          fi
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth build $BUILD_FLAGS

          echo "=== Restarting services ==="
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth up -d

          echo "=== Waiting for services to start ==="
          sleep 10

          echo "=== Restarting nginx to pick up new container IPs ==="
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth restart nginx
          sleep 5

          echo "=== Cleaning up Docker to prevent disk fill ==="
          docker image prune -f
          docker builder prune -f --keep-storage 5GB

          echo "=== Deployment complete ==="
          docker compose -f docker-compose.stealth.yml ps
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          echo "Checking site..."
          curl -sf https://ignite.cam/ -o /dev/null && echo "✓ Site is up" || echo "✗ Site check failed"

# =============================================================================
# GitHub Actions: Deploy to Stealth (Single EC2 Instance)
# =============================================================================
# Pulls pre-built images from ECR and restarts services
# Triggered by build-images workflow or manual dispatch
# =============================================================================

name: Deploy to Stealth

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Images"]
    types:
      - completed
    branches:
      - main

env:
  DEPLOY_HOST: ${{ secrets.STEALTH_HOST }}
  DEPLOY_USER: ec2-user
  APP_DIR: /opt/campfire
  COMPOSE_FILE: infra/docker/docker-compose.stealth.yml
  ENV_FILE: /opt/campfire/.env.stealth
  AWS_REGION: us-east-1
  ECR_REGISTRY: 932630290000.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    name: Deploy to Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if triggered manually or if build-images succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STEALTH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STEALTH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync config files to server
        run: |
          rsync -avz \
            --include='infra/***' \
            --include='pnpm-lock.yaml' \
            --include='package.json' \
            --exclude='*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.APP_DIR }}/

      - name: Update environment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_MEDIA_BUCKET: ${{ secrets.S3_MEDIA_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          PROVIDER_KEY_ENCRYPTION_SECRET: ${{ secrets.PROVIDER_KEY_ENCRYPTION_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FLOWGUARD_SHOP_ID: ${{ secrets.FLOWGUARD_SHOP_ID }}
          FLOWGUARD_SIGNATURE_KEY: ${{ secrets.FLOWGUARD_SIGNATURE_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "
          set -e
          ENV_FILE=/opt/campfire/.env.stealth

          # Function to update or add env var
          update_env() {
            local key=\$1
            local value=\$2
            if grep -q \"^\${key}=\" \"\$ENV_FILE\" 2>/dev/null; then
              sed -i \"s|^\${key}=.*|\${key}=\${value}|\" \"\$ENV_FILE\"
            else
              echo \"\${key}=\${value}\" >> \"\$ENV_FILE\"
            fi
          }

          # Update AWS credentials
          update_env 'AWS_ACCESS_KEY_ID' '${AWS_ACCESS_KEY_ID}'
          update_env 'AWS_SECRET_ACCESS_KEY' '${AWS_SECRET_ACCESS_KEY}'
          update_env 'AWS_REGION' '${AWS_REGION}'
          update_env 'S3_MEDIA_BUCKET' '${S3_MEDIA_BUCKET}'

          # Update other secrets
          update_env 'JWT_SECRET' '${JWT_SECRET}'
          update_env 'SESSION_SECRET' '${SESSION_SECRET}'
          update_env 'INTERNAL_SERVICE_KEY' '${INTERNAL_SERVICE_KEY}'
          update_env 'PROVIDER_KEY_ENCRYPTION_SECRET' '${PROVIDER_KEY_ENCRYPTION_SECRET}'
          update_env 'GOOGLE_OAUTH_CLIENT_ID' '${GOOGLE_OAUTH_CLIENT_ID}'
          update_env 'GOOGLE_OAUTH_CLIENT_SECRET' '${GOOGLE_OAUTH_CLIENT_SECRET}'
          update_env 'FLOWGUARD_SHOP_ID' '${FLOWGUARD_SHOP_ID}'
          update_env 'FLOWGUARD_SIGNATURE_KEY' '${FLOWGUARD_SIGNATURE_KEY}'

          # Set ECR registry for pulling images
          update_env 'ECR_REGISTRY' '932630290000.dkr.ecr.us-east-1.amazonaws.com'

          echo 'Environment secrets updated'
          "

      - name: Pull images and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd /opt/campfire/infra/docker

          echo "=== Logging into ECR ==="
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 932630290000.dkr.ecr.us-east-1.amazonaws.com

          echo "=== Pulling latest images ==="
          export ECR_REGISTRY=932630290000.dkr.ecr.us-east-1.amazonaws.com
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth pull gateway web workers orchestrator

          echo "=== Restarting services ==="
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth up -d

          echo "=== Waiting for services to start ==="
          sleep 10

          echo "=== Restarting nginx to pick up new container IPs ==="
          docker compose -f docker-compose.stealth.yml --env-file /opt/campfire/.env.stealth restart nginx
          sleep 5

          echo "=== Cleaning up old images ==="
          docker image prune -f

          echo "=== Deployment complete ==="
          docker compose -f docker-compose.stealth.yml ps
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          echo "Checking site..."
          curl -sf https://ignite.cam/ -o /dev/null && echo "✓ Site is up" || echo "✗ Site check failed"

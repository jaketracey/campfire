# =============================================================================
# Campfire - Production-like Local Testing Docker Compose
# =============================================================================
# Usage: docker-compose -f docker-compose.prod.yml up -d
# This configuration mimics production settings for local testing.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18.1 with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: campfire-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: campfire
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-campfire_prod_secret}
      POSTGRES_DB: campfire_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campfire -d campfire_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis - Caching, rate limiting, and queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campfire-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 640mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-campfire_redis_secret}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-campfire_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Gateway Service - API Gateway and WebSocket server
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.gateway
      target: production
    container_name: campfire-gateway-prod
    restart: always
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 4000
      WS_PORT: 4001
      DATABASE_URL: postgresql://campfire:${DATABASE_PASSWORD:-campfire_prod_secret}@postgres:5432/campfire_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-campfire_redis_secret}@redis:6379
      ORCHESTRATOR_URL: http://orchestrator:5000
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---------------------------------------------------------------------------
  # Orchestrator Service - AI/ML pipeline orchestration
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.orchestrator
      target: production
    container_name: campfire-orchestrator-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 5000
      DATABASE_URL: postgresql://campfire:${DATABASE_PASSWORD:-campfire_prod_secret}@postgres:5432/campfire_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-campfire_redis_secret}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      S3_VAULT_BUCKET: ${S3_VAULT_BUCKET}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---------------------------------------------------------------------------
  # Web Application - Main user-facing application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      target: production
    container_name: campfire-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_GATEWAY_URL: ${GATEWAY_URL}
      NEXT_PUBLIC_WS_URL: ${WS_URL}
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_API_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---------------------------------------------------------------------------
  # Workers - Background job processing
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.workers
      target: production
    container_name: campfire-workers-prod
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://campfire:${DATABASE_PASSWORD:-campfire_prod_secret}@postgres:5432/campfire_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-campfire_redis_secret}@redis:6379
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      S3_VAULT_BUCKET: ${S3_VAULT_BUCKET}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy - Production-like routing
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: campfire-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - web
    networks:
      - campfire-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  campfire-prod-network:
    driver: bridge

# =============================================================================
# Campfire - Local Development Docker Compose
# =============================================================================
# Usage: docker-compose up -d
# This configuration is for local development only.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18.1 with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: campfire-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: campfire
      POSTGRES_PASSWORD: campfire_dev
      POSTGRES_DB: campfire_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campfire -d campfire_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Redis - Caching, rate limiting, and queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campfire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Gateway Service - API Gateway and WebSocket server
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: campfire-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"  # WebSocket port
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 4000
      WS_PORT: 4001
      DATABASE_URL: postgresql://campfire:campfire_dev@postgres:5432/campfire_dev
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:5000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Orchestrator Service - AI/ML pipeline orchestration
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.orchestrator
    container_name: campfire-orchestrator
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 5000
      DATABASE_URL: postgresql://campfire:campfire_dev@postgres:5432/campfire_dev
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-campfire-media-dev}
      S3_VAULT_BUCKET: ${S3_VAULT_BUCKET:-campfire-vault-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Web Application - Main user-facing application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    container_name: campfire-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Marketing Site - Landing pages and marketing content
  # ---------------------------------------------------------------------------
  marketing:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.marketing
    container_name: campfire-marketing
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_GTM_ID: ${GTM_CONTAINER_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Workers - Background job processing
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.workers
    container_name: campfire-workers
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://campfire:campfire_dev@postgres:5432/campfire_dev
      REDIS_URL: redis://redis:6379
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-campfire-media-dev}
      S3_VAULT_BUCKET: ${S3_VAULT_BUCKET:-campfire-vault-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - campfire-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  campfire-network:
    driver: bridge

# =============================================================================
# Campfire - Stealth Launch Docker Compose
# =============================================================================
# Optimized for single EC2 t4g.small instance (2 vCPU, 2GB RAM)
# Total memory budget: ~1.8GB for containers, 200MB for system
# =============================================================================
# Usage: docker compose -f docker-compose.stealth.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: campfire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campfire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campfire}
      POSTGRES_DB: campfire
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campfire -d campfire"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    # Optimized postgres settings for low memory
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c maintenance_work_mem=32MB
      -c work_mem=4MB
      -c max_connections=50
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Redis - Caching, rate limiting, and queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campfire-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 220mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Gateway Service - API Gateway and WebSocket server
  # ---------------------------------------------------------------------------
  gateway:
    image: ${ECR_REGISTRY}/campfire-gateway:${CAMPFIRE_IMAGE_TAG:-latest}
    container_name: campfire-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 4000
      WS_PORT: 4001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: campfire
      DATABASE_USER: campfire
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-campfire}
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:5000
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PROVIDER_KEY_ENCRYPTION_SECRET: ${PROVIDER_KEY_ENCRYPTION_SECRET}
      # LiveKit (Video Chat)
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_WS_URL: ${LIVEKIT_URL:-}
      # Deepgram (STT)
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # FAL.ai (lip-sync video, image gen)
      FAL_API_KEY: ${FAL_API_KEY:-}
      CORS_ORIGINS: https://ignite.cam,https://www.ignite.cam,http://localhost:3000
      # Public-facing URL for email links
      WEB_URL: https://ignite.cam
      # Local Ollama disabled in stealth mode
      OLLAMA_ENABLED: "false"
      # Flowguard (Verotel/YoursAfe) Payment Processing
      FLOWGUARD_SHOP_ID: ${FLOWGUARD_SHOP_ID:-}
      FLOWGUARD_SIGNATURE_KEY: ${FLOWGUARD_SIGNATURE_KEY:-}
      FLOWGUARD_BASE_URL: ${FLOWGUARD_BASE_URL:-https://flowguard.yoursafe.com}
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Facebook Ads
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_ADS_REDIRECT_URI: https://${DOMAIN:-ignite.cam}/api/v1/admin/ads/callback/facebook
      # Web base URL for OAuth redirects
      WEB_BASE_URL: https://${DOMAIN:-ignite.cam}
      # AWS S3 for image uploads
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # ElevenLabs Voice
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only access for admin logs
    group_add:
      - "992"  # Docker group GID on host - allows container to access docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Orchestrator Service - AI/ML pipeline orchestration
  # ---------------------------------------------------------------------------
  orchestrator:
    image: ${ECR_REGISTRY}/campfire-orchestrator:${CAMPFIRE_IMAGE_TAG:-latest}
    container_name: campfire-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 5000
      DATABASE_URL: postgresql+asyncpg://campfire:${POSTGRES_PASSWORD:-campfire}@postgres:5432/campfire
      REDIS_URL: redis://redis:6379
      PROVIDER_KEY_ENCRYPTION_SECRET: ${PROVIDER_KEY_ENCRYPTION_SECRET}
      # Local Ollama disabled in stealth mode
      OLLAMA_ENABLED: "false"
      # ComfyUI disabled in stealth mode (using FAL.ai cloud instead)
      COMFYUI_ENABLED: "false"
      # Cloud AI (disabled for stealth, fallback only)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      # FAL (Avatar/Image generation)
      FAL_API_KEY: ${FAL_API_KEY:-}
      # LiveKit (Video Chat)
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Deepgram (STT)
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # AWS S3
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Web Application - Main user-facing application
  # ---------------------------------------------------------------------------
  web:
    image: ${ECR_REGISTRY}/campfire-web:${CAMPFIRE_IMAGE_TAG:-latest}
    container_name: campfire-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side API calls (internal Docker network)
      GATEWAY_URL: http://gateway:4000
      # Client-side API calls (public URL)
      NEXT_PUBLIC_GATEWAY_URL: https://${DOMAIN:-ignite.cam}
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN:-ignite.cam}/ws
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      NEXT_PUBLIC_FLOWGUARD_SHOP_ID: ${FLOWGUARD_SHOP_ID:-}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Workers - Background job processing
  # ---------------------------------------------------------------------------
  workers:
    image: ${ECR_REGISTRY}/campfire-workers:${CAMPFIRE_IMAGE_TAG:-latest}
    container_name: campfire-workers
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://campfire:${POSTGRES_PASSWORD:-campfire}@postgres:5432/campfire
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:5000
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      S3_BUCKET_MEDIA: ${S3_MEDIA_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Email (optional)
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-}
      SES_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Workers process image/video/render workloads and need more headroom than other services.
    # Keep this high enough for sharp image conversion to avoid OOM restarts.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - campfire-network

  # ---------------------------------------------------------------------------
  # Nginx - Reverse proxy (SSL handled by Cloudflare)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: campfire-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.stealth.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - campfire-network

# =============================================================================
# Volumes - Persistent data
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  campfire-network:
    driver: bridge

# =============================================================================
# Memory Budget Summary (2GB total)
# =============================================================================
# PostgreSQL:  384 MB (limit) / 256 MB (reserve)
# Redis:       256 MB (limit) / 128 MB (reserve)
# Gateway:     256 MB (limit) / 128 MB (reserve)
# Orchestrator: 384 MB (limit) / 192 MB (reserve)
# Web:         384 MB (limit) / 192 MB (reserve)
# Workers:     768 MB (limit) / 256 MB (reserve)
# Nginx:        64 MB (limit) / 32 MB (reserve)
# ------------------------------------------------
# Total:     2,176 MB (limit) / 1,152 MB (reserve)
# System:     ~200 MB buffer for OS
# =============================================================================
